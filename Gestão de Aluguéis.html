<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Aluguéis</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#035485',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                        emerald: {
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Estilos de Impressão */
        #print-area { display: none; }

        @media print {
            .no-print { display: none !important; }
            #print-area { display: block !important; width: 100% !important; margin: 0 !important; padding: 0 !important; }
            body { background: white !important; color: black !important; }
            main { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
            header, .no-print-container { display: none !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header Navbar -->
    <header class="bg-gradient-to-r from-slate-900 via-brand-900 to-slate-900 text-white shadow-lg sticky top-0 z-50 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-brand-500/20 rounded-xl border border-brand-500/30">
                    <i class="fa-solid fa-building-user text-2xl text-brand-500"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight">Gestão de Aluguéis</h1>
                    <div class="flex items-center gap-2 mt-0.5 text-xs text-slate-300 font-medium">
                        <i class="fa-solid fa-calendar-days text-brand-500"></i>
                        <span>Ano de Exercício:</span>
                        <select id="current-year-select" onchange="changeYear()" class="bg-slate-800/80 border border-slate-700 rounded-md px-2 py-0.5 text-white font-semibold focus:ring-2 focus:ring-brand-500 outline-none cursor-pointer text-xs">
                        </select>
                    </div>
                </div>
            </div>

            <!-- Card Acumulado Anual -->
            <div class="bg-slate-800/80 px-4 py-2 rounded-xl border border-slate-700 text-right w-full sm:w-auto flex flex-row sm:flex-col justify-between items-center sm:items-end">
                <span class="text-[10px] uppercase font-semibold text-slate-300 tracking-wider">TOTAL ACUMULADO <span id="label-year-badge"></span></span>
                <span id="grand-annual-total" class="text-lg sm:text-2xl font-black text-emerald-400 tracking-tight">R$ 0,00</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow">
        <div class="no-print space-y-6">
            
            <!-- Configuração do Locador -->
            <div class="bg-white rounded-2xl shadow-sm border border-slate-200/80 p-4 flex flex-col sm:flex-row items-start sm:items-center gap-3">
                <label for="locador-nome" class="text-xs font-bold uppercase text-slate-700 tracking-wider flex items-center gap-2 whitespace-nowrap">
                    <i class="fa-solid fa-user-tie text-brand-600"></i> Nome do Locador:
                </label>
                <input type="text" id="locador-nome" placeholder="Nome Completo / Razão Social / Empresa" oninput="saveLocador()" class="w-full sm:max-w-md px-3 py-2 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 text-xs sm:text-sm font-semibold focus:ring-2 focus:ring-brand-500 focus:bg-white transition outline-none">
            </div>

            <!-- Abas de Meses -->
            <div class="bg-white rounded-2xl border border-slate-200/80 p-3 shadow-sm">
                <div class="month-tabs grid grid-cols-3 sm:grid-cols-4 md:grid-cols-6 lg:grid-cols-12 gap-1.5" id="month-tabs">
                    <!-- Gerado via JS -->
                </div>
            </div>

            <!-- Painel de Controles e Ações -->
            <div class="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-sm space-y-4">
                <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-4 border-b border-slate-100 pb-4">
                    <div class="flex items-center gap-2">
                        <i class="fa-solid fa-calendar-check text-brand-600 text-lg"></i>
                        <h2 class="text-base font-bold text-slate-900">Mês Ref: <span id="current-month-display" class="text-brand-600">Janeiro</span></h2>
                    </div>

                    <!-- Botões de Ação Superior -->
                    <div class="flex flex-wrap items-center gap-2 w-full lg:w-auto">
                        <button onclick="copyFromPreviousMonth()" class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 bg-amber-500 hover:bg-amber-600 text-white text-xs font-bold px-3 py-2 rounded-lg transition shadow-sm">
                            <i class="fa-solid fa-copy"></i> Copiar Anterior
                        </button>
                        <button onclick="saveData(true)" class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-2 rounded-lg transition shadow-sm">
                            <i class="fa-solid fa-floppy-disk"></i> Salvar Tudo
                        </button>
                        <button onclick="clearCurrentMonth()" class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 bg-orange-600 hover:bg-orange-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition shadow-sm">
                            <i class="fa-solid fa-eraser"></i> Limpar Mês
                        </button>
                        <button onclick="prepareAndPrint('mensal')" class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 bg-slate-800 hover:bg-slate-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition shadow-sm">
                            <i class="fa-solid fa-print"></i> Relat. Mês
                        </button>
                        <button onclick="prepareAndPrint('anual')" class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 bg-purple-700 hover:bg-purple-800 text-white text-xs font-bold px-3 py-2 rounded-lg transition shadow-sm">
                            <i class="fa-solid fa-chart-line"></i> Relat. Anual
                        </button>
                        <button onclick="exportBackup()" class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 bg-slate-600 hover:bg-slate-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition shadow-sm">
                            <i class="fa-solid fa-file-export"></i> Exportar
                        </button>
                        <button onclick="document.getElementById('fileInput').click()" class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition shadow-sm">
                            <i class="fa-solid fa-file-import"></i> Importar
                        </button>
                        <button onclick="clearFullYear()" class="flex-1 sm:flex-none inline-flex items-center justify-center gap-1.5 bg-rose-600 hover:bg-rose-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition shadow-sm">
                            <i class="fa-solid fa-triangle-exclamation"></i> Limpar Ano
                        </button>
                        <input type="file" id="fileInput" style="display:none" accept=".json" onchange="importBackup(event)">
                    </div>
                </div>

                <!-- Tabela Responsiva de Aluguéis -->
                <div class="overflow-x-auto rounded-xl border border-slate-200">
                    <table id="main-table" class="w-full text-left text-xs border-collapse">
                        <thead>
                            <tr class="bg-slate-900 text-white font-bold uppercase tracking-wider text-[11px]">
                                <th class="py-3 px-3 text-center w-[50px]">Ordem</th>
                                <th class="py-3 px-3 w-[18%]">Inquilino</th>
                                <th class="py-3 px-3 w-[12%]">Data Pagto</th>
                                <th class="py-3 px-3 w-[8%]">Reajuste</th>
                                <th class="py-3 px-3 w-[10%]">CDC IPTU</th>
                                <th class="py-3 px-3 w-[12%]">Destino</th>
                                <th class="py-3 px-3 w-[10%]">Aluguel</th>
                                <th class="py-3 px-3 w-[10%]">Extras</th>
                                <th class="py-3 px-3 w-[10%]">Subtotal</th>
                                <th class="py-3 px-3 text-center w-[160px]">Ações</th>
                            </tr>
                        </thead>
                        <tbody id="rent-rows" class="divide-y divide-slate-100 bg-white font-medium text-slate-700">
                            <!-- Linhas injetadas dinamicamente -->
                        </tbody>
                    </table>
                </div>
            </div>

        </div>

        <!-- Área de Impressão -->
        <div id="print-area"></div>
    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-12 py-6 text-center text-xs text-slate-500 no-print">
        <div class="max-w-7xl mx-auto px-4">
            <p>Sistema Integrado para Gestão e Controle de Contratos de Locação Imobiliária.</p>
            <p class="mt-1 text-slate-400">&copy; Gestão de Aluguéis - Todos os direitos reservados.</p>
        </div>
    </footer>

<script>
    const meses = ["Janeiro", "Fevereiro", "Março", "Abril", "Maio", "Junho", "Julho", "Agosto", "Setembro", "Outubro", "Novembro", "Dezembro"];
    let currentYear = localStorage.getItem('selected_year') || new Date().getFullYear();
    let currentMonthIdx = 0;

    function init() {
        const yearSelect = document.getElementById('current-year-select');
        for(let y = 2024; y <= 2050; y++){
            yearSelect.innerHTML += `<option value="${y}" ${y==currentYear?'selected':''}>${y}</option>`;
        }
        const tabs = document.getElementById('month-tabs');
        meses.forEach((m, i) => { 
            tabs.innerHTML += `<button class="month-btn py-2 px-1 text-center border border-slate-200 bg-slate-50 hover:bg-slate-100 font-bold rounded-lg text-xs text-slate-700 transition shadow-sm ${i===0?'!border-brand-600 !text-brand-600 !bg-brand-50 shadow-inner':''}" id="tab-${i}" onclick="switchMonth(${i})">${m}</button>`; 
        });
        
        loadMonthData(0);
        document.getElementById('locador-nome').value = localStorage.getItem('locador_nome') || '';
        updateAnnualTotal();
    }

    function createRowHTML() {
        return `
            <td class="no-print p-2 text-center align-middle">
                <div class="flex flex-col gap-1 items-center justify-center">
                    <button class="btn-move w-7 h-5 bg-slate-100 hover:bg-brand-600 hover:text-white border border-slate-300 rounded text-slate-600 flex items-center justify-center font-bold text-xs transition" onclick="mover(this, -1)"><i class="fa-solid fa-chevron-up text-[10px]"></i></button>
                    <button class="btn-move w-7 h-5 bg-slate-100 hover:bg-brand-600 hover:text-white border border-slate-300 rounded text-slate-600 flex items-center justify-center font-bold text-xs transition" onclick="mover(this, 1)"><i class="fa-solid fa-chevron-down text-[10px]"></i></button>
                </div>
            </td>
            <td class="p-2"><input type="text" class="in-name w-full px-2.5 py-1.5 bg-slate-50 border border-slate-300 rounded-md text-xs font-semibold text-slate-900 focus:ring-2 focus:ring-brand-500 focus:bg-white outline-none transition" oninput="saveData(false)"></td>
            <td class="p-2"><input type="date" class="in-date w-full px-2 py-1.5 bg-slate-50 border border-slate-300 rounded-md text-xs text-slate-700 focus:ring-2 focus:ring-brand-500 focus:bg-white outline-none transition" oninput="saveData(false)"></td>
            <td class="p-2"><input type="text" class="in-reajuste w-full px-2 py-1.5 bg-slate-50 border border-slate-300 rounded-md text-xs text-slate-700 focus:ring-2 focus:ring-brand-500 focus:bg-white outline-none transition" placeholder="Ex: Mar" oninput="saveData(false)"></td>
            <td class="p-2"><input type="text" class="in-cdc w-full px-2 py-1.5 bg-slate-50 border border-slate-300 rounded-md text-xs text-slate-700 focus:ring-2 focus:ring-brand-500 focus:bg-white outline-none transition" placeholder="000-0" oninput="saveData(false)"></td>
            <td class="p-2"><input type="text" class="in-destino w-full px-2 py-1.5 bg-slate-50 border border-slate-300 rounded-md text-xs text-slate-700 focus:ring-2 focus:ring-brand-500 focus:bg-white outline-none transition" placeholder="Pix" oninput="saveData(false)"></td>
            <td class="p-2"><input type="number" step="0.01" class="in-val w-full px-2 py-1.5 bg-slate-50 border border-slate-300 rounded-md text-xs font-medium text-slate-800 focus:ring-2 focus:ring-brand-500 focus:bg-white outline-none transition" oninput="autoCalc(this)"></td>
            <td class="p-2"><input type="number" step="0.01" class="in-extra w-full px-2 py-1.5 bg-slate-50 border border-slate-300 rounded-md text-xs font-medium text-slate-800 focus:ring-2 focus:ring-brand-500 focus:bg-white outline-none transition" oninput="autoCalc(this)"></td>
            <td class="row-total p-2 font-extrabold text-brand-700 text-xs">R$ 0,00</td>
            <td class="p-2">
                <div class="flex flex-col gap-1">
                    <button class="btn-demo-row border border-amber-600 text-amber-700 hover:bg-amber-600 hover:text-white py-1 px-1.5 rounded text-[10px] font-bold uppercase transition w-full text-center" onclick="gerarDemonstrativo(this.closest('tr').rowIndex - 1)">Demonstrativo</button>
                    <button class="btn-demo-row border border-purple-600 text-purple-700 hover:bg-purple-600 hover:text-white py-1 px-1.5 rounded text-[10px] font-bold uppercase transition w-full text-center" onclick="gerarExtratoIndividual(this.closest('tr').rowIndex - 1)">Extrato Anual</button>
                    <button class="btn-demo-row border border-emerald-600 text-emerald-700 hover:bg-emerald-600 hover:text-white py-1 px-1.5 rounded text-[10px] font-bold uppercase transition w-full text-center" onclick="gerarRecibo(this.closest('tr').rowIndex - 1)">Recibo</button>
                    <div class="row-controls flex gap-1 justify-center items-center mt-1">
                        <button class="btn-icon add text-brand-600 hover:bg-brand-50 p-1.5 rounded text-sm transition" title="Adicionar Linha" onclick="addRow(this)"><i class="fa-solid fa-circle-plus"></i></button>
                        <button class="btn-icon save text-emerald-600 hover:bg-emerald-50 p-1.5 rounded text-sm transition" title="Salvar" onclick="saveData(true)"><i class="fa-solid fa-circle-check"></i></button>
                        <button class="btn-icon del text-rose-600 hover:bg-rose-50 p-1.5 rounded text-sm transition" title="Excluir" onclick="deleteRow(this)"><i class="fa-solid fa-trash-can"></i></button>
                    </div>
                </div>
            </td>`;
    }

    function mover(btn, direcao) {
        saveData(false);
        const row = btn.closest('tr');
        const index = row.rowIndex - 1;
        const saved = localStorage.getItem(`data_${currentYear}_mes_${currentMonthIdx}`);
        if(!saved) return;
        
        let data = JSON.parse(saved);
        const novoIndex = index + direcao;
        
        if (novoIndex >= 0 && novoIndex < data.length) {
            const temp = data[index];
            data[index] = data[novoIndex];
            data[novoIndex] = temp;
            localStorage.setItem(`data_${currentYear}_mes_${currentMonthIdx}`, JSON.stringify(data));
            loadMonthData(currentMonthIdx);
        }
    }

    function addRow(btn = null) {
        const tbody = document.getElementById('rent-rows');
        const newRow = document.createElement('tr');
        newRow.className = "hover:bg-slate-50 transition border-b border-slate-100";
        newRow.innerHTML = createRowHTML();
        if (btn) btn.closest('tr').after(newRow);
        else tbody.appendChild(newRow);
        saveData(false);
    }

    function deleteRow(btn) {
        if(confirm("Excluir esta linha?")) { btn.closest('tr').remove(); saveData(false); }
    }

    function autoCalc(inputEl) {
        const row = inputEl.closest('tr');
        const v = parseFloat(row.querySelector('.in-val').value) || 0;
        const e = parseFloat(row.querySelector('.in-extra').value) || 0;
        row.querySelector('.row-total').innerText = (v + e).toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
        saveData(false);
    }

    function saveData(verbose) {
        const data = Array.from(document.querySelectorAll('#rent-rows tr')).map(row => ({
            n: row.querySelector('.in-name').value, d: row.querySelector('.in-date').value,
            r: row.querySelector('.in-reajuste').value, v: row.querySelector('.in-val').value, 
            e: row.querySelector('.in-extra').value, dest: row.querySelector('.in-destino').value,
            cdc: row.querySelector('.in-cdc').value
        }));
        localStorage.setItem(`data_${currentYear}_mes_${currentMonthIdx}`, JSON.stringify(data));
        updateAnnualTotal(); 
        if(verbose) alert("Dados salvos com sucesso!");
    }

    function loadMonthData(idx) {
        const saved = localStorage.getItem(`data_${currentYear}_mes_${idx}`);
        const tbody = document.getElementById('rent-rows');
        tbody.innerHTML = '';
        if(saved) {
            const data = JSON.parse(saved);
            data.forEach(d => {
                const row = document.createElement('tr');
                row.className = "hover:bg-slate-50 transition border-b border-slate-100";
                row.innerHTML = createRowHTML();
                row.querySelector('.in-name').value = d.n || ''; 
                row.querySelector('.in-date').value = d.d || ''; 
                row.querySelector('.in-reajuste').value = d.r || ''; 
                row.querySelector('.in-val').value = d.v || ''; 
                row.querySelector('.in-extra').value = d.e || ''; 
                row.querySelector('.in-destino').value = d.dest || '';
                row.querySelector('.in-cdc').value = d.cdc || '';
                const total = (parseFloat(d.v)||0) + (parseFloat(d.e)||0);
                row.querySelector('.row-total').innerText = total.toLocaleString('pt-BR', {style:'currency', currency:'BRL'});
                tbody.appendChild(row);
            });
        }
        if(tbody.children.length === 0) for(let i=0; i < 5; i++) addRow();
    }

    function switchMonth(idx) { 
        saveData(false); 
        currentMonthIdx = idx; 
        document.querySelectorAll('.month-btn').forEach(b => {
            b.classList.remove('!border-brand-600', '!text-brand-600', '!bg-brand-50', 'shadow-inner');
        }); 
        const activeTab = document.getElementById(`tab-${idx}`);
        if(activeTab) activeTab.classList.add('!border-brand-600', '!text-brand-600', '!bg-brand-50', 'shadow-inner');
        document.getElementById('current-month-display').innerText = meses[idx]; 
        loadMonthData(idx); 
    }

    function changeYear() { saveData(false); currentYear = document.getElementById('current-year-select').value; localStorage.setItem('selected_year', currentYear); loadMonthData(currentMonthIdx); updateAnnualTotal(); }
    function saveLocador() { localStorage.setItem('locador_nome', document.getElementById('locador-nome').value); }
    function updateAnnualTotal() { let t = 0; for(let i=0; i<12; i++){ JSON.parse(localStorage.getItem(`data_${currentYear}_mes_${i}`)||'[]').forEach(x => t += (parseFloat(x.v)||0)+(parseFloat(x.e)||0)); } document.getElementById('grand-annual-total').innerText = t.toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); document.getElementById('label-year-badge').innerText = currentYear; }
    
    function copyFromPreviousMonth() { 
        if(currentMonthIdx === 0) return alert("Não há mês anterior."); 
        const prev = localStorage.getItem(`data_${currentYear}_mes_${currentMonthIdx - 1}`); 
        if(prev) { 
            const data = JSON.parse(prev); 
            const tbody = document.getElementById('rent-rows'); 
            tbody.innerHTML = ''; 
            data.forEach((d) => { 
                const row = document.createElement('tr'); 
                row.className = "hover:bg-slate-50 transition border-b border-slate-100";
                row.innerHTML = createRowHTML(); 
                row.querySelector('.in-name').value = d.n || ''; 
                row.querySelector('.in-reajuste').value = d.r || ''; 
                row.querySelector('.in-cdc').value = d.cdc || ''; 
                row.querySelector('.in-val').value = d.v || ''; 
                row.querySelector('.in-extra').value = d.e || ''; 
                row.querySelector('.in-destino').value = d.dest || ''; 
                if(d.d) { 
                    const dia = d.d.split('-')[2]; 
                    const mesCorrente = (currentMonthIdx + 1).toString().padStart(2, '0'); 
                    row.querySelector('.in-date').value = `${currentYear}-${mesCorrente}-${dia}`; 
                } 
                const total = (parseFloat(d.v)||0) + (parseFloat(d.e)||0); 
                row.querySelector('.row-total').innerText = total.toLocaleString('pt-BR', {style:'currency', currency:'BRL'}); 
                tbody.appendChild(row); 
            }); 
            saveData(false); 
        } 
    }

    function clearCurrentMonth() { if(confirm(`Limpar ${meses[currentMonthIdx]}?`)) { localStorage.removeItem(`data_${currentYear}_mes_${currentMonthIdx}`); loadMonthData(currentMonthIdx); updateAnnualTotal(); } }
    
    function exportBackup() { 
        let backup = {}; 
        for (let i = 0; i < localStorage.length; i++) { 
            let k = localStorage.key(i); 
            if (k.startsWith('data_') || k === 'locador_nome' || k === 'selected_year') {
                backup[k] = localStorage.getItem(k); 
            }
        } 

        const agora = new Date();
        const dataStr = agora.toLocaleDateString('pt-BR').replace(/\//g, '-');
        const horaStr = agora.getHours().toString().padStart(2, '0') + 'h' + agora.getMinutes().toString().padStart(2, '0');
        
        const json = JSON.stringify(backup, null, 2);
        const blob = new Blob([json], { type: 'application/json' }); 
        const url = URL.createObjectURL(blob);
        
        const a = document.createElement('a'); 
        a.href = url; 
        a.download = `Gestão_de_Aluguéis_${currentYear}_${dataStr}_${horaStr}.json`; 
        
        document.body.appendChild(a); 
        a.click(); 
        
        setTimeout(() => {
            document.body.removeChild(a);
            window.URL.revokeObjectURL(url);
        }, 200);
    }

    function importBackup(ev) { 
        const file = ev.target.files[0]; if (!file) return; 
        const reader = new FileReader(); 
        reader.onload = (e) => { 
            try { 
                const d = JSON.parse(e.target.result); 
                if (confirm("Importar dados?")) { localStorage.clear(); for (let k in d) localStorage.setItem(k, d[k]); location.reload(); } 
            } catch (err) { alert("Erro."); } 
        }; reader.readAsText(file); 
    }
    
    function clearFullYear() { if(confirm(`Zerar dados de ${currentYear}?`)){ for(let i=0; i<12; i++) localStorage.removeItem(`data_${currentYear}_mes_${i}`); location.reload(); } }

    function gerarDemonstrativo(rowIdx) {
        saveData(false);
        const rows = document.querySelectorAll('#rent-rows tr');
        if(!rows[rowIdx]) return;
        const row = rows[rowIdx];
        const nome = row.querySelector('.in-name').value || "(Inquilino)";
        const reajuste = row.querySelector('.in-reajuste').value;
        const cdc = row.querySelector('.in-cdc').value || 'Não informado';
        const destino = row.querySelector('.in-destino').value || 'Não informado';
        const val = parseFloat(row.querySelector('.in-val').value) || 0;
        const extra = parseFloat(row.querySelector('.in-extra').value) || 0;
        const total = val + extra;
        const dataF = row.querySelector('.in-date').value ? row.querySelector('.in-date').value.split('-').reverse().join('/') : 'A Combinar';
        const locador = document.getElementById('locador-nome').value || '(Locador)';
        let mesRefIdx = currentMonthIdx - 1; let anoRef = currentYear; 
        if(mesRefIdx < 0) { mesRefIdx = 11; anoRef = parseInt(currentYear) - 1; }
        const area = document.getElementById('print-area');
        area.innerHTML = `
        <style>
            .demo-wrapper { font-family: 'Segoe UI', Arial, sans-serif; padding: 40px; max-width: 800px; margin: 0 auto; color: #000; background: #fff; border: none !important; box-shadow: none !important; }
            .demo-header { border-bottom: 2px solid #333; margin-bottom: 20px; text-align: center; }
            .demo-header h1 { margin: 10px 0; text-transform: uppercase; font-size: 1.5rem; }
            .demo-section { display: flex; justify-content: space-between; margin-bottom: 20px; }
            .demo-section h4 { margin: 0 0 5px 0; color: #666; text-transform: uppercase; font-size: 0.75rem; }
            .demo-section p { margin: 0; font-size: 1.1rem; }
            .prof-table { width: 100%; border-collapse: collapse; margin-top: 10px; }
            .prof-table th { background: #f2f2f2; border: 1px solid #333; padding: 12px; text-align: left; font-size: 0.9rem; }
            .prof-table td { border: 1px solid #333; padding: 12px; font-size: 1rem; }
            .val-negativo { color: #e74c3c; font-weight: bold; }
            .signature-block { margin-top: 50px; text-align: center; width: 280px; margin-left: auto; }
            .signature-line { border-top: 1.5px solid #333; margin-top: 8px; }
            .signature-name { font-weight: bold; text-transform: uppercase; margin: 0; font-size: 0.9rem; }
            @media print {
                body * { visibility: hidden; }
                #print-area, #print-area * { visibility: visible; }
                #print-area { position: absolute; left: 0; top: 0; width: 100%; zoom: 70%; }
                .demo-wrapper { border: none !important; box-shadow: none !important; margin: 0 auto; outline: none !important; }
            }
        </style>
        <div class="demo-wrapper">
            <div class="demo-header"><h1>Demonstrativo de Aluguel</h1></div>
            <div class="demo-section">
                <div><h4>Locador</h4><p><strong>${locador}</strong></p></div>
                <div style="text-align: right;"><h4>Inquilino</h4><p><strong>${nome.toUpperCase()}</strong></p></div>
            </div>
            <div class="demo-section">
                <div><h4>Mês de Referência</h4><p>${meses[mesRefIdx]} / ${anoRef}</p></div>
                <div style="text-align: right;"><h4>Data Limite para Pgto</h4><p><strong>${dataF}</strong></p></div>
            </div>
            <table class="prof-table">
                <thead><tr><th>Item / Descrição</th><th style="text-align: right;">Valor (R$)</th></tr></thead>
                <tbody>
                    <tr><td>Aluguel Mensal de Imóvel</td><td style="text-align: right;">${val.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td></tr>
                    <tr><td>Encargos / Extras / Descontos / Retenção IR</td><td style="text-align: right;" class="${extra < 0 ? 'val-negativo' : ''}">${extra.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td></tr>
                    <tr style="font-weight: bold; background: #eee !important;">
                        <td>TOTAL GERAL A RECEBER</td>
                        <td style="text-align: right;">${total.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
                    </tr>
                </tbody>
            </table>
            <div style="margin-top: 25px; font-size: 0.85rem; display: flex; justify-content: space-between; border-bottom: 1px solid #ddd; padding-bottom: 15px;">
                <span><strong>FORMA DE PGTO:</strong> ${destino}</span>
                <span><strong>IPTU (INSCRIÇÃO):</strong> ${cdc}</span>
            </div>
            <div style="padding: 12px; border-left: 5px solid #333; margin: 25px 0; font-size: 0.85rem; background: #f9f9f9; line-height: 1.4;">
                <strong>INFORMAÇÃO IMPORTANTE:</strong> Este documento serve para conferência de valores. O pagamento após o vencimento implicará em encargos previstos em contrato.
            </div>
            ${reajuste ? `<div style="color: #d35400; font-weight: bold; margin-top: 10px; text-align: center; border: 1px dashed #d35400; padding: 10px; font-size: 0.9rem;">⚠️ ATENÇÃO: MÊS DE REAJUSTE CONTRATUAL EM ${reajuste.toUpperCase()}</div>` : ''}
            <div class="signature-block">
                <p class="signature-name">${locador}</p>
                <div class="signature-line"></div>
                <p style="font-size: 0.7rem; margin-top: 5px; color: #666;">Assinatura do Locador</p>
            </div>
        </div>`;
        window.print();
    }

    function gerarExtratoIndividual(rowIdx) {
        saveData(false);
        const rows = document.querySelectorAll('#rent-rows tr');
        const nomeInquilino = rows[rowIdx].querySelector('.in-name').value;
        const locador = document.getElementById('locador-nome').value || '(Locador)';
        if(!nomeInquilino) return alert("Por favor, preencha o nome do inquilino.");
        let htmlExtrato = `
            <style>
                .extrato-wrapper { font-family: Arial, sans-serif; padding: 40px; color: #333; background: white; border: none !important; box-shadow: none !important; max-width: 900px; margin: 0 auto; }
                .signature-block { margin-top: 50px; text-align: center; width: 280px; margin-left: auto; }
                .signature-line { border-top: 1.5px solid #333; margin-top: 8px; }
                .signature-name { font-weight: bold; text-transform: uppercase; margin: 0; font-size: 0.9rem; }
                @media print {
                    body * { visibility: hidden; }
                    #print-area, #print-area * { visibility: visible; }
                    #print-area { position: absolute; left: 0; top: 0; width: 100%; zoom: 70%; }
                    .extrato-wrapper { border: none !important; box-shadow: none !important; outline: none !important; }
                }
            </style>
            <div class="extrato-wrapper">
                <h2 style="text-align: center; border-bottom: 2px solid #1a2a3a; padding-bottom: 10px;">Extrato Anual Consolidado para Declaração no IR</h2>
                <div style="margin: 20px 0; line-height: 1.6;">
                    <p><strong>LOCADOR:</strong> ${locador.toUpperCase()}</p>
                    <p><strong>INQUILINO:</strong> ${nomeInquilino.toUpperCase()}</p>
                    <p><strong>ANO DE REFERÊNCIA:</strong> ${currentYear}</p>
                </div>
                <table style="width:100%; border-collapse: collapse; margin-top: 20px; border: 1.5px solid #000;">
                    <thead><tr style="background: #f2f2f2; color: #000;">
                        <th style="padding:12px; text-align:left; border:1px solid #000; font-size: 0.9rem;">MÊS</th>
                        <th style="padding:12px; text-align:center; border:1px solid #000; font-size: 0.9rem;">DATA PAGTO</th>
                        <th style="padding:12px; text-align:right; border:1px solid #000; font-size: 0.9rem;">VALOR TOTAL</th>
                    </tr></thead><tbody>`;
        let totalAnual = 0;
        let encontrou = false;
        for(let i=0; i<12; i++) {
            const dados = JSON.parse(localStorage.getItem(`data_${currentYear}_mes_${i}`) || '[]');
            const reg = dados.find(r => r.n && r.n.trim().toUpperCase() === nomeInquilino.trim().toUpperCase());
            if(reg) {
                encontrou = true;
                const v = (parseFloat(reg.v)||0) + (parseFloat(reg.e)||0);
                totalAnual += v;
                htmlExtrato += `<tr>
                    <td style="padding:10px; border:1px solid #000;">${meses[i].toUpperCase()}</td>
                    <td style="padding:10px; border:1px solid #000; text-align:center;">${reg.d ? reg.d.split('-').reverse().join('/') : '--'}</td>
                    <td style="padding:10px; border:1px solid #000; text-align:right;">${v.toLocaleString('pt-BR', {minimumFractionDigits: 2})}</td>
                </tr>`;
            }
        }
        if(!encontrou) return alert("Sem dados para este inquilino.");
        htmlExtrato += `
                <tr style="font-weight:bold; background:#eee;">
                    <td colspan="2" style="padding:12px; text-align:right; border:1.5px solid #000;">TOTAL ACUMULADO NO ANO:</td>
                    <td style="padding:12px; text-align:right; border:1.5px solid #000;">${totalAnual.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td>
                </tr></tbody></table>
                <div class="signature-block">
                    <p class="signature-name">${locador}</p>
                    <div class="signature-line"></div>
                    <p style="font-size: 0.7rem; margin-top: 5px; color: #666;">Assinatura do Locador</p>
                </div>
            </div>`;
        const area = document.getElementById('print-area');
        area.innerHTML = htmlExtrato;
        window.print();
    }

    function gerarRecibo(rowIdx) {
        saveData(false);
        const rows = document.querySelectorAll('#rent-rows tr');
        if(!rows[rowIdx]) return;
        const row = rows[rowIdx];
        
        const nome = row.querySelector('.in-name').value || "(Inquilino)";
        const val = parseFloat(row.querySelector('.in-val').value) || 0;
        const extra = parseFloat(row.querySelector('.in-extra').value) || 0;
        const total = val + extra;
        const locador = document.getElementById('locador-nome').value || '(Locador)';
        const dataF = new Date().toLocaleDateString('pt-BR');

        const area = document.getElementById('print-area');
        area.innerHTML = `
        <style>
            .recibo-wrapper { font-family: 'Segoe UI', Arial, sans-serif; padding: 40px; max-width: 800px; margin: 0 auto; color: #000; background: #fff; border: 2px solid #000; outline: none !important; }
            .recibo-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #000; padding-bottom: 10px; margin-bottom: 30px; }
            .recibo-header h1 { margin: 0; text-transform: uppercase; font-size: 2rem; letter-spacing: 2px; }
            .recibo-val { font-size: 1.5rem; font-weight: bold; background: #f2f2f2; padding: 10px 20px; border: 2px solid #000; border-radius: 5px;}
            .recibo-body { font-size: 1.2rem; line-height: 1.8; text-align: justify; margin-bottom: 50px; }
            .recibo-footer { text-align: right; font-size: 1.1rem; margin-bottom: 60px; }
            .signature-block { margin-top: 50px; text-align: center; width: 400px; margin: 0 auto; }
            .signature-line { border-top: 1.5px solid #000; margin-top: 8px; }
            .signature-name { font-weight: bold; text-transform: uppercase; margin: 0; font-size: 1rem; }
            @media print {
                body * { visibility: hidden; }
                #print-area, #print-area * { visibility: visible; }
                #print-area { position: absolute; left: 0; top: 0; width: 100%; zoom: 80%; }
                .recibo-wrapper { border: 2px solid #000 !important; margin-top: 20px; }
            }
        </style>
        <div class="recibo-wrapper">
            <div class="recibo-header">
                <h1>Recibo</h1>
                <div class="recibo-val">${total.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</div>
            </div>
            <div class="recibo-body">
                Recebi(emos) de <strong>${nome.toUpperCase()}</strong>, a importância supra de <strong>${total.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</strong>, referente ao pagamento do aluguel e encargos do mês de <strong>${meses[currentMonthIdx]} / ${currentYear}</strong>.
                <br><br>
                Para maior clareza, firmo(amos) o presente recibo.
            </div>
            <div class="recibo-footer">
                Taboão da Serra - SP, ${dataF}
            </div>
            <div class="signature-block">
                <p class="signature-name">${locador}</p>
                <div class="signature-line"></div>
                <p style="font-size: 0.8rem; margin-top: 5px; color: #666;">Assinatura do Locador</p>
            </div>
        </div>`;
        window.print();
    }

    function prepareAndPrint(type) {
        saveData(false);
        const area = document.getElementById('print-area');
        const locador = (document.getElementById('locador-nome').value || 'Não informado').toUpperCase();
        let totalGeral = 0;
        let html = `
        <style>
            .rep-container { font-family: Arial, sans-serif; background: white; padding: 20px; }
            .rep-header { border-bottom: 2px solid #000; text-align: center; margin-bottom: 20px; }
            .rep-table { width: 100%; border-collapse: collapse; }
            .rep-table th, .rep-table td { border-bottom: 1px solid #eee; padding: 8px; font-size: 9pt; }
            .rep-table th { border-bottom: 2px solid #000; background: #f9f9f9; }
            .rep-month-title { font-weight: bold; background: #f0f0f0 !important; }
            @media print { #print-area { zoom: 85%; } }
        </style>
        <div class="rep-container">
            <div class="rep-header"><h3>RELATÓRIO DE RECEBIMENTOS - ${type.toUpperCase()}</h3><p>LOCADOR: ${locador} | ANO: ${currentYear}</p></div>
            <table class="rep-table">
                <thead><tr><th style="text-align:left">Inquilino</th><th>Data</th><th style="text-align:right">Aluguel</th><th style="text-align:right">Extras</th><th style="text-align:right">Total</th></tr></thead>
                <tbody>`;
        const getMonthDataForPrint = (idx) => {
            const data = JSON.parse(localStorage.getItem(`data_${currentYear}_mes_${idx}`) || '[]');
            let rHtml = ''; let sub = 0; let has = false;
            data.forEach(r => {
                const total = (parseFloat(r.v)||0) + (parseFloat(r.e)||0);
                if(r.n || total > 0) {
                    has = true; sub += total; totalGeral += total;
                    rHtml += `<tr><td><strong>${r.n.toUpperCase()}</strong></td><td style="text-align:center">${r.d?r.d.split('-').reverse().join('/'):'--'}</td><td style="text-align:right">${(parseFloat(r.v)||0).toLocaleString('pt-BR', {minimumFractionDigits:2})}</td><td style="text-align:right">${(parseFloat(r.e)||0).toLocaleString('pt-BR', {minimumFractionDigits:2})}</td><td style="text-align:right; font-weight:bold">${total.toLocaleString('pt-BR', {minimumFractionDigits:2})}</td></tr>`;
                }
            });
            return has ? `<tr class="rep-month-title"><td colspan="5">${meses[idx].toUpperCase()}</td></tr>` + rHtml + `<tr><td colspan="4" style="text-align:right; font-weight:bold">Subtotal:</td><td style="text-align:right; font-weight:bold">${sub.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</td></tr>` : '';
        };
        if(type === 'mensal') html += getMonthDataForPrint(currentMonthIdx);
        else for(let i=0; i<12; i++) html += getMonthDataForPrint(i);
        html += `</tbody></table><p style="text-align:right; font-weight:bold; font-size: 12pt; border-top: 2px solid #000; padding-top:10px;">TOTAL GERAL: ${totalGeral.toLocaleString('pt-BR', {style:'currency', currency:'BRL'})}</p></div>`;
        area.innerHTML = html; window.print();
    }
    window.onload = init;
</script>
</body>
</html>
