<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestão de Contratos Imobiliários</title>
    <!-- Tailwind CSS CDN -->

    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['Courier New', 'Courier', 'monospace']
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#075985',
                            800: '#0c4a6e',

                    }

        /* Scrollbar personalizada */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Quebra de Página no Editor */
        .quebra-pagina {
            page-break-after: always;
            border-top: 2px dashed #0284c7;
            margin: 40px 0;
            position: relative;
            height: 20px;
            cursor: default;
            user-select: none;
        }
        .quebra-pagina::before {
            content: "--- QUEBRA DE PÁGINA (NÃO SAI NA IMPRESSÃO) ---";
            position: absolute;
            top: -22px;
            left: 50%;
            transform: translateX(-50%);
            font-family: 'Inter', sans-serif;
            font-size: 10px;
            color: #0284c7;
            font-weight: 700;
        }

        /* Estilos de Impressão */
        @media print {
            .no-print, header, footer, .toolbar, .tabs-container, .simulador-container, .card-inputs {
                display: none !important;
            }
            body {
                background: white !important;
                padding: 0 !important;
                margin: 0 !important;
            }
            main {
                padding: 0 !important;
                margin: 0 !important;
                max-width: 100% !important;
            }
            #editor {
                border: none !important;
                padding: 0 !important;
                margin: 0 !important;
                width: 100% !important;
                box-shadow: none !important;
            }
            @page {
                margin: 2cm;
            }
            .quebra-pagina {
                border: none !important;
                height: 0 !important;
                margin: 0 !important;
            }
            .quebra-pagina::before {

            }
        }
    </style>
</head>
<body class="bg-slate-100 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <header class="bg-gradient-to-r from-slate-900 via-sky-950 to-slate-900 text-white shadow-lg sticky top-0 z-50 no-print">

                <div class="p-2 bg-brand-500/20 rounded-xl border border-brand-500/30">
                    <i class="fa-solid fa-file-contract text-2xl text-brand-500"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight flex items-center gap-2">
                        Gestão de Contratos Imobiliários

                    <p class="text-xs text-slate-300">Editor e Gerenciador de Contratos por Imóvel</p>
                </div>
            </div>
            
            <div class="flex items-center gap-2 flex-wrap justify-center">

                    <i class="fa-solid fa-file-export"></i> Backup (JSON)

                </button>

                <button onclick="window.print()" class="btn flex items-center gap-2 bg-emerald-600 hover:bg-emerald-500 text-white font-semibold text-xs px-3.5 py-2 rounded-lg shadow-sm transition border border-emerald-400/30">

                    <label class="block text-[11px] font-bold uppercase tracking-wider text-slate-600 mb-1">Cidade / Bairro:</label>
                    <input type="text" id="in-pref" oninput="updateCurrentData()" class="w-full px-3 py-1.5 bg-slate-50 border border-slate-300 rounded-lg text-slate-900 text-xs font-semibold focus:ring-2 focus:ring-brand-500 focus:bg-white focus:outline-none transition">

                <div>

                <!-- Botões Estilo de Texto -->

                <button onclick="document.execCommand('foreColor', false, 'blue')" class="bg-slate-700 hover:bg-slate-600 text-blue-400 font-bold px-2 py-1 rounded" title="Texto Azul">A</button>

                <!-- Utilitários -->
                <button onclick="insertDate()" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded" title="Inserir Data"><i class="fa-regular fa-calendar-days"></i> Data</button>

                <button onclick="copyToClipboard()" class="bg-slate-700 hover:bg-slate-600 px-2 py-1 rounded" title="Copiar Texto HTML"><i class="fa-regular fa-copy"></i> Copiar</button>
                <button onclick="clearAll()" class="bg-rose-900/60 hover:bg-rose-800 text-rose-200 px-2 py-1 rounded" title="Limpar Editor"><i class="fa-solid fa-trash-can"></i> Limpar</button>

                <!-- Localizar -->                
                <div class="flex items-center gap-1 bg-slate-700 px-2 py-0.5 rounded border border-slate-600">
                    <i class="fa-solid fa-magnifying-glass text-slate-400"></i>
                    <input type="text" id="busca-texto" placeholder="Localizar..." class="bg-transparent text-white px-1 py-0.5 w-96 focus:outline-none text-xs">

<div class="h-4 w-px bg-slate-600 mx-1"></div>

                <button onclick="window.scrollTo({top: 0, behavior: 'smooth'})" class="bg-rose-900/60 hover:bg-rose-800 text-rose-200 px-2 py-1 rounded" title="Início da Página">

                </span>
                <input type="date" id="s-data" class="px-2 py-1 bg-white border border-slate-300 rounded text-slate-800 font-mono text-xs focus:outline-none">
                <span class="font-bold">+</span>
                <input type="number" id="s-mes" value="0" class="w-14 px-2 py-1 bg-white border border-slate-300 rounded text-slate-800 font-mono text-xs focus:outline-none">
                <span class="font-medium text-slate-600">meses</span>
                
                <button class="bg-white hover:bg-slate-100 border border-slate-300 text-slate-800 font-bold px-3 py-1 rounded shadow-sm transition" 
                    onclick="let d=new Date(document.getElementById('s-data').value+'T12:00:00'); d.setMonth(d.getMonth()+parseInt(document.getElementById('s-mes').value)); document.getElementById('s-res').innerText=d.toLocaleDateString('pt-BR');" 
                    title="Calcular Data">

                </button>

        <!-- Folha Editor A4 -->

            <div id="editor" contenteditable="true" oninput="updateCurrentData()" class="w-[210mm] min-h-[297mm] p-[20mm] bg-white border border-slate-300 shadow-xl rounded-sm font-mono text-xs leading-relaxed text-justify outline-none text-slate-900"></div>

            <p class="mt-1 text-slate-400">&copy; Todos os direitos reservados.</p>

    <script>
        let imoveis = [{ nome: 'Imóvel 1', pref: '', iptu: '', mat: '', contrato: '' }];
        let activeIndex = 0;
        let dragSrcIndex = null;

        function renderTabs() {
            const container = document.getElementById('tab-list');
            container.innerHTML = '';
            imoveis.forEach((imovel, index) => {
                const tab = document.createElement('div');
                const isActive = index === activeIndex;
                tab.className = `px-4 py-2 text-xs font-bold rounded-t-xl cursor-pointer border transition-all flex items-center gap-2 ${isActive ? 'bg-white text-brand-700 border-slate-300 border-b-transparent shadow-sm -mb-px z-10' : 'bg-slate-200 hover:bg-slate-300 text-slate-600 border-transparent'}`;
                tab.innerText = imovel.nome || `Imóvel ${index + 1}`;
                tab.draggable = true;
                tab.dataset.index = index;
                tab.onclick = () => switchTab(index);
                tab.ondragstart = (e) => { dragSrcIndex = index; e.target.classList.add('opacity-40'); };
                tab.ondragover = (e) => e.preventDefault();
                tab.ondrop = (e) => {
                    const targetIndex = parseInt(tab.dataset.index);
                    if (dragSrcIndex !== targetIndex) {
                        const item = imoveis.splice(dragSrcIndex, 1)[0];
                        imoveis.splice(targetIndex, 0, item);
                        activeIndex = targetIndex;
                        saveToStorage(); renderTabs(); loadCurrentData();
                    }
                };
                tab.ondragend = (e) => e.target.classList.remove('opacity-40');
                container.appendChild(tab);
            });
            const addBtn = document.createElement('button');
            addBtn.className = 'px-3 py-2 bg-slate-300 hover:bg-slate-400 text-slate-800 text-xs font-bold rounded-t-xl transition';
            addBtn.innerText = '+ Nova Aba';
            addBtn.onclick = addImovel;
            container.appendChild(addBtn);
        }

        function switchTab(index) { activeIndex = index; loadCurrentData(); renderTabs(); }
        function addImovel() {
            imoveis.push({ nome: `Novo Imóvel`, pref: '', iptu: '', mat: '', contrato: '' });
            activeIndex = imoveis.length - 1;
            loadCurrentData(); renderTabs(); saveToStorage();
        }

        function deleteImovel() {
            if (imoveis.length === 1) return alert("Você precisa de pelo menos uma aba aberta!");
            if (confirm(`Excluir a aba "${imoveis[activeIndex].nome}"?`)) {
                imoveis.splice(activeIndex, 1);
                if (activeIndex >= imoveis.length) activeIndex = imoveis.length - 1;
                renderTabs(); loadCurrentData(); saveToStorage();
            }
        }

        function loadCurrentData() {
            const item = imoveis[activeIndex];
            document.getElementById('in-imovel').value = item.nome || '';
            document.getElementById('in-pref').value = item.pref || '';
            document.getElementById('in-iptu').value = item.iptu || '';
            document.getElementById('in-mat').value = item.mat || '';
            document.getElementById('editor').innerHTML = item.contrato || '';
        }

        function updateCurrentData() {
            imoveis[activeIndex].nome = document.getElementById('in-imovel').value;
            imoveis[activeIndex].pref = document.getElementById('in-pref').value;
            imoveis[activeIndex].iptu = document.getElementById('in-iptu').value;
            imoveis[activeIndex].mat = document.getElementById('in-mat').value;
            imoveis[activeIndex].contrato = document.getElementById('editor').innerHTML;
            renderTabs(); saveToStorage();
        }

        function saveToStorage() { localStorage.setItem('alberto_multicontratos', JSON.stringify(imoveis)); }

        window.onload = function() {
            const saved = localStorage.getItem('alberto_multicontratos');
            if (saved) imoveis = JSON.parse(saved);
            renderTabs(); loadCurrentData();
        };

        async function copyToClipboard() {
            const editor = document.getElementById('editor');
            try {
                const type = "text/html";
                const blob = new Blob([editor.innerHTML], { type });
                const data = [new ClipboardItem({ [type]: blob, ["text/plain"]: new Blob([editor.innerText], {type: "text/plain"}) })];
                await navigator.clipboard.write(data);
                alert("Contrato copiado para a área de transferência!");
            } catch (err) { alert("Erro ao copiar."); }
        }

        function exportBackup() {
            const agora = new Date();
            const ano = agora.getFullYear(); 
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const dataCompleta = `${dia}-${mes}-${ano}`;
            const horas = String(agora.getHours()).padStart(2, '0');
            const minutos = String(agora.getMinutes()).padStart(2, '0');
            const segundos = String(agora.getSeconds()).padStart(2, '0');
            const horario = `${horas}-${minutos}-${segundos}`;

            const nomeArquivo = `Gestao_de_Contratos_${ano}_${dataCompleta}_${horario}.json`;
            
            const blob = new Blob([JSON.stringify(imoveis)], { type: "application/json" });
            const a = document.createElement("a");
            a.href = URL.createObjectURL(blob); 
            a.download = nomeArquivo; 
            a.click();
        }

        function importBackup(event) {
            const file = event.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = (e) => {
                imoveis = JSON.parse(e.target.result); activeIndex = 0;
                saveToStorage(); location.reload();
            };
            reader.readAsText(file);
        }

        function changeFontSize(size) {
            document.execCommand('fontSize', false, '7');
            const fontSpans = document.getElementsByTagName("font");
            for (let i = 0; i < fontSpans.length; i++) {
                if (fontSpans[i].size == "7") {
                    fontSpans[i].removeAttribute("size");
                    fontSpans[i].style.fontSize = size;
                }
            }
            updateCurrentData();
        }

        function changeLineHeight(spacing) {
            const selection = window.getSelection();
            if (!selection.rangeCount || selection.isCollapsed) return;

            document.execCommand('foreColor', false, '#000004');
            const marks = document.querySelectorAll('font[color="#000004"]');
            
            marks.forEach(mark => {
                mark.removeAttribute('color');
                mark.style.color = 'black';
                
                let block = mark.parentElement;
                while (block && block.id !== 'editor' && !['P', 'DIV', 'LI'].includes(block.tagName)) {
                    block = block.parentElement;
                }

                if (block && block.id !== 'editor') {
                    block.style.lineHeight = spacing;
                    block.style.margin = "0px 0px 5px 0px"; 
                    block.style.padding = "0px";
                } else {
                    const div = document.createElement('div');
                    div.style.lineHeight = spacing;
                    div.style.display = 'block';
                    div.style.margin = "0px 0px 5px 0px";
                    mark.parentNode.insertBefore(div, mark);
                    div.appendChild(mark);
                }
            });
            updateCurrentData();
        }

        function insertDate() {
            const d = new Date();
            const dataF = d.toLocaleDateString('pt-BR', { day: '2-digit', month: 'long', year: 'numeric' });
            document.execCommand('insertText', false, "São Paulo, " + dataF);
            updateCurrentData();
        }

        function clearAll() { if(confirm("Limpar o texto deste contrato?")) { document.getElementById('editor').innerHTML = ''; updateCurrentData(); } }

        document.getElementById('editor').addEventListener('paste', function(e) {
            e.preventDefault();
            let html = (e.originalEvent || e).clipboardData.getData('text/html');
            if (html) {
                let div = document.createElement('div');
                div.innerHTML = html;
                div.querySelectorAll('*').forEach(el => {
                    el.style.border = 'none'; el.style.boxShadow = 'none'; el.style.background = 'transparent';
                    el.style.width = '100%'; el.style.maxWidth = '100%'; el.style.boxSizing = 'border-box';
                    if (['P', 'DIV', 'LI'].includes(el.tagName)) { el.style.display = 'block'; el.style.margin = '0 0 10px 0'; el.style.padding = '0'; }
                });
                document.execCommand('insertHTML', false, div.innerHTML);
            } else {
                const text = (e.originalEvent || e).clipboardData.getData('text/plain');
                document.execCommand('insertText', false, text);
            }
            document.execCommand('fontName', false, 'Courier New');
            updateCurrentData();
        });

        function inserirQuebra() {
            const div = document.createElement('div');
            div.className = 'quebra-pagina'; div.contentEditable = false; 
            const selection = window.getSelection();
            if (selection.rangeCount > 0) {
                const range = selection.getRangeAt(0);
                range.insertNode(div);
                const br = document.createElement('br'); div.after(br);
                range.setStartAfter(br); range.setEndAfter(br);
            }
            updateCurrentData();
        }

        function buscarNoTexto() {
            const termo = document.getElementById('busca-texto').value;
            if (!termo) return;
            
            if (!window.find(termo, false, false, true, false, true, false)) {
                window.getSelection().removeAllRanges();
                window.find(termo, false, false, true, false, true, false);
            }
        }

        document.addEventListener('keydown', function (e) {
            const campoBusca = document.getElementById('busca-texto');
            if (e.key === 'Enter' && campoBusca.value.trim() !== "") {
                e.preventDefault();
                buscarNoTexto();
            }
        });

        function ajustarRecuo(valor) {
            document.execCommand('formatBlock', false, 'div');
            const selection = window.getSelection();
            if (selection.rangeCount > 0) {
                let range = selection.getRangeAt(0);
                let node = range.commonAncestorContainer;
                if (node.nodeType === 3) node = node.parentNode;
                
                while (node && node.id !== 'editor' && !['DIV', 'P'].includes(node.tagName)) {
                    node = node.parentNode;
                }
                if (node && node.id !== 'editor') {
                    node.style.textIndent = valor;
                }
            }
            updateCurrentData();
        }
    </script>
</body>
</html>
