<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FleetManager PRO</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                    },
                    colors: {
                        brand: {
                            50: '#f0f9ff',
                            100: '#e0f2fe',
                            500: '#0284c7',
                            600: '#0369a1',
                            700: '#035485',
                            800: '#075985',
                            900: '#0c4a6e',
                        },
                        emerald: {
                            500: '#10b981',
                            600: '#059669',
                            700: '#047857',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Custom scrollbar */
        ::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        ::-webkit-scrollbar-track {
            background: #f1f5f9;
        }
        ::-webkit-scrollbar-thumb {
            background: #cbd5e1;
            border-radius: 4px;
        }
        ::-webkit-scrollbar-thumb:hover {
            background: #94a3b8;
        }

        /* Animação do Accordion */
        .veiculo-bloco .arrow-icon {
            transition: transform 0.3s ease;
        }
        .veiculo-bloco.active .arrow-icon {
            transform: rotate(180deg);
        }
        .veiculo-content {
            display: none;
        }
        .veiculo-bloco.active .veiculo-content {
            display: block;
        }

        /* Estilos de Impressão */
        @media print {
            .no-print { display: none !important; }
            body { background: white !important; color: black !important; zoom: 100%; }
            main { max-width: 100% !important; padding: 0 !important; margin: 0 !important; }
            header, nav { display: none !important; }
            .table-container { border: none !important; box-shadow: none !important; }
            th, td { border-bottom: 1px solid #ddd !important; }
        }
    </style>
</head>
<body class="bg-slate-50 text-slate-800 font-sans antialiased min-h-screen flex flex-col justify-between">

    <!-- Header Navbar -->
    <header class="bg-gradient-to-r from-slate-900 via-brand-900 to-slate-900 text-white shadow-lg sticky top-0 z-50 no-print">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-4 flex flex-col sm:flex-row justify-between items-center gap-4">
            <div class="flex items-center gap-3">
                <div class="p-2 bg-brand-500/20 rounded-xl border border-brand-500/30">
                    <i class="fa-solid fa-truck-monster text-2xl text-brand-500"></i>
                </div>
                <div>
                    <h1 class="text-xl sm:text-2xl font-bold tracking-tight">FleetManager <span class="text-emerald-500">PRO</span></h1>
                    <p class="text-xs text-slate-300 font-medium">Gestão Integrada de Frotas e Manutenções</p>
                </div>
            </div>

            <!-- Botões Globais de Backup -->
            <div class="flex items-center gap-2">
                <button onclick="exportarDados()" class="inline-flex items-center justify-center gap-1.5 bg-slate-700 hover:bg-slate-600 text-white text-xs font-bold px-3 py-2 rounded-lg transition shadow-sm">
                    <i class="fa-solid fa-file-export"></i> Exportar
                </button>
                <button onclick="document.getElementById('importFile').click()" class="inline-flex items-center justify-center gap-1.5 bg-indigo-600 hover:bg-indigo-700 text-white text-xs font-bold px-3 py-2 rounded-lg transition shadow-sm">
                    <i class="fa-solid fa-file-import"></i> Importar
                </button>
                <input type="file" id="importFile" style="display:none" accept=".json" onchange="importarDados(event)">
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 w-full flex-grow space-y-6">

        <!-- Formulários de Cadastro e Lançamento -->
        <div class="grid grid-cols-1 lg:grid-cols-2 gap-6 no-print">
            
            <!-- Cadastro de Veículo -->
            <section class="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-sm space-y-4">
                <div class="flex items-center gap-2 border-b border-slate-100 pb-3">
                    <i class="fa-solid fa-car text-brand-600 text-lg"></i>
                    <h2 class="text-base font-bold text-slate-900">Cadastro de Veículo</h2>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-3">
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Modelo</label>
                        <input type="text" id="cadModelo" class="uppercase px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-slate-900 text-xs font-semibold focus:ring-2 focus:ring-brand-500 outline-none transition">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Proprietário</label>
                        <input type="text" id="cadDono" class="uppercase px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-slate-900 text-xs font-semibold focus:ring-2 focus:ring-brand-500 outline-none transition">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Cor</label>
                        <input type="text" id="cadCor" class="uppercase px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-slate-900 text-xs font-semibold focus:ring-2 focus:ring-brand-500 outline-none transition">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Ano</label>
                        <input type="text" id="cadAno" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-slate-900 text-xs font-semibold focus:ring-2 focus:ring-brand-500 outline-none transition">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">KM Inicial</label>
                        <input type="number" id="cadKMIni" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-slate-900 text-xs font-semibold focus:ring-2 focus:ring-brand-500 outline-none transition">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Placa</label>
                        <input type="text" id="cadPlaca" class="uppercase px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-slate-900 text-xs font-semibold focus:ring-2 focus:ring-brand-500 outline-none transition" maxlength="8" oninput="this.value = aplicarMascaraPlaca(this.value)">
                    </div>
                </div>
                <div class="pt-2">
                    <button class="w-full bg-brand-600 hover:bg-brand-500 text-white text-xs font-bold py-2 rounded-lg transition shadow-sm flex items-center justify-center gap-1.5" onclick="cadastrarVeiculo()">
                        <i class="fa-solid fa-plus-circle"></i> Cadastrar Veículo
                    </button>
                </div>
            </section>

            <!-- Novo Lançamento -->
            <section class="bg-white rounded-2xl border border-slate-200/80 p-5 shadow-sm space-y-4">
                <div class="flex items-center gap-2 border-b border-slate-100 pb-3">
                    <i class="fa-solid fa-wrench text-brand-600 text-lg"></i>
                    <h2 class="text-base font-bold text-slate-900">Novo Lançamento</h2>
                </div>
                <div class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-3">
                    <div class="flex flex-col gap-1 sm:col-span-2">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Veículo</label>
                        <select id="selectVeiculo" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-slate-900 text-xs font-semibold focus:ring-2 focus:ring-brand-500 outline-none transition">
                            <option value="">-- Selecione --</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Data</label>
                        <input type="date" id="servData" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-slate-900 text-xs font-semibold focus:ring-2 focus:ring-brand-500 outline-none transition">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Categoria</label>
                        <select id="servCat" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-slate-900 text-xs font-semibold focus:ring-2 focus:ring-brand-500 outline-none transition">
                            <option value="Manutenção">MANUTENÇÃO</option>
                            <option value="Combustível">COMBUSTÍVEL</option>
                            <option value="Pedágio">PEDÁGIO</option>
                            <option value="IPVA">IPVA</option>
                            <option value="Licenciamento">LICENCIAMENTO</option>
                            <option value="Seguro">SEGURO</option>
                            <option value="Multa">MULTA</option>
                        </select>
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">KM Atual</label>
                        <input type="number" id="servKM" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-slate-900 text-xs font-semibold focus:ring-2 focus:ring-brand-500 outline-none transition">
                    </div>
                    <div class="flex flex-col gap-1 sm:col-span-3">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Prestador</label>
                        <input type="text" id="servResponsavel" class="uppercase px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-slate-900 text-xs font-semibold focus:ring-2 focus:ring-brand-500 outline-none transition">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Peças (R$)</label>
                        <input type="number" id="servPecas" step="0.01" value="0.00" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-slate-900 text-xs font-semibold focus:ring-2 focus:ring-brand-500 outline-none transition">
                    </div>
                    <div class="flex flex-col gap-1">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Mão de Obra (R$)</label>
                        <input type="number" id="servMaoObra" step="0.01" value="0.00" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-slate-900 text-xs font-semibold focus:ring-2 focus:ring-brand-500 outline-none transition">
                    </div>
                    <div class="flex flex-col gap-1 sm:col-span-2">
                        <label class="text-[10px] font-bold text-slate-500 uppercase">Descrição</label>
                        <textarea id="servDesc" rows="1" class="px-3 py-1.5 bg-white border border-slate-300 rounded-lg text-slate-900 text-xs font-semibold focus:ring-2 focus:ring-brand-500 outline-none transition resize-none"></textarea>
                    </div>
                </div>
                <div class="pt-2">
                    <button class="w-full bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold py-2 rounded-lg transition shadow-sm flex items-center justify-center gap-1.5" onclick="lancarServico()">
                        <i class="fa-solid fa-circle-check"></i> Salvar Lançamento
                    </button>
                </div>
            </section>

        </div>

        <!-- Relatórios / Lista de Veículos -->
        <div id="relatorios" class="space-y-4"></div>

    </main>

    <!-- Footer -->
    <footer class="bg-white border-t border-slate-200 mt-12 py-6 text-center text-xs text-slate-500 no-print">
        <div class="max-w-7xl mx-auto px-4">
            <p>FleetManager PRO - Sistema Integrado de Gestão de Frotas e Manutenções.</p>
            <p class="mt-1 text-slate-400">&copy; Todos os direitos reservados.</p>
        </div>
    </footer>

    <script>
        const STORAGE_KEY = 'frota_db_v32_final';
        let dados = JSON.parse(localStorage.getItem(STORAGE_KEY)) || { veiculos: [] };
        let editandoId = { veiculo: null, servico: null };
        let blocosAbertos = new Set();

        document.getElementById('servData').valueAsDate = new Date();

        function aplicarMascaraPlaca(v) {
            v = v.toUpperCase().replace(/[^A-Z0-9]/g, '');
            if (v.length > 3) v = v.substring(0, 3) + '-' + v.substring(3, 7);
            return v;
        }

        function toggleAccordion(event, id) {
            if (event.target.closest('.btn') || event.target.closest('input') || event.target.closest('textarea') || event.target.closest('select')) return;
            blocosAbertos.has(id) ? blocosAbertos.delete(id) : blocosAbertos.add(id);
            renderizarRelatorios();
        }

        function salvarEAtualizar() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(dados));
            renderizarSelect();
            renderizarRelatorios();
        }

        function cadastrarVeiculo() {
            const m = document.getElementById('cadModelo').value;
            const p = document.getElementById('cadPlaca').value;
            if(!m || !p) return alert("Modelo e Placa são obrigatórios!");
            const novoId = Date.now();
            dados.veiculos.push({ 
                id: novoId, 
                modelo: m.toUpperCase(), 
                proprietario: document.getElementById('cadDono').value.toUpperCase(), 
                cor: document.getElementById('cadCor').value.toUpperCase(), 
                ano: document.getElementById('cadAno').value, 
                kmIni: document.getElementById('cadKMIni').value || 0, 
                placa: aplicarMascaraPlaca(p), 
                registros: [] 
            });
            blocosAbertos.add(novoId);
            salvarEAtualizar();
            ['cadModelo', 'cadDono', 'cadCor', 'cadAno', 'cadPlaca', 'cadKMIni'].forEach(id => document.getElementById(id).value = '');
        }

        function toggleEdicaoVeiculo(e, id) {
            e.stopPropagation();
            if(editandoId.veiculo === id) {
                const vIdx = dados.veiculos.findIndex(v => v.id == id);
                dados.veiculos[vIdx].modelo = document.getElementById(`editMod-${id}`).value.toUpperCase();
                dados.veiculos[vIdx].placa = aplicarMascaraPlaca(document.getElementById(`editPlaca-${id}`).value);
                dados.veiculos[vIdx].proprietario = document.getElementById(`editProp-${id}`).value.toUpperCase();
                dados.veiculos[vIdx].cor = document.getElementById(`editCor-${id}`).value.toUpperCase();
                dados.veiculos[vIdx].ano = document.getElementById(`editAno-${id}`).value;
                dados.veiculos[vIdx].kmIni = document.getElementById(`editKMIni-${id}`).value;
                editandoId.veiculo = null;
                salvarEAtualizar();
            } else { editandoId.veiculo = id; renderizarRelatorios(); }
        }

        function toggleEdicaoServico(e, vId, sId) {
            e.stopPropagation();
            if(editandoId.servico === sId) {
                const vIdx = dados.veiculos.findIndex(v => v.id == vId);
                const sIdx = dados.veiculos[vIdx].registros.findIndex(s => s.id == sId);
                const reg = dados.veiculos[vIdx].registros[sIdx];
                reg.data = document.getElementById(`editSData-${sId}`).value.split('-').reverse().join('/');
                reg.responsavel = document.getElementById(`editSResp-${sId}`).value.toUpperCase();
                reg.km = document.getElementById(`editSKM-${sId}`).value;
                reg.pecas = parseFloat(document.getElementById(`editSPec-${sId}`).value) || 0;
                reg.maoObra = parseFloat(document.getElementById(`editSMao-${sId}`).value) || 0;
                reg.total = reg.pecas + reg.maoObra;
                reg.desc = document.getElementById(`editSDesc-${sId}`).value;
                editandoId.servico = null;
                salvarEAtualizar();
            } else { editandoId.servico = sId; renderizarRelatorios(); }
        }

        function renderizarRelatorios() {
            const container = document.getElementById('relatorios');
            container.innerHTML = '';
            dados.veiculos.forEach(v => {
                let totalV = 0;
                const isOpen = blocosAbertos.has(v.id);
                const isEditV = editandoId.veiculo === v.id;
                let linhas = v.registros.map(r => {
                    totalV += r.total;
                    const isEditS = editandoId.servico === r.id;
                    if(isEditS) {
                        return `<tr class="bg-amber-50/50"><td colspan="7" class="p-3">
                            <div class="grid grid-cols-1 sm:grid-cols-6 gap-2 bg-slate-100 p-2.5 rounded-lg border border-slate-200">
                                <div class="flex flex-col gap-0.5"><label class="text-[9px] font-bold text-slate-500 uppercase">Data</label><input type="date" id="editSData-${r.id}" value="${r.data.split('/').reverse().join('-')}" class="px-2 py-1 bg-white border border-slate-300 rounded text-xs font-semibold"></div>
                                <div class="flex flex-col gap-0.5 sm:col-span-2"><label class="text-[9px] font-bold text-slate-500 uppercase">Prestador</label><input type="text" id="editSResp-${r.id}" value="${r.responsavel}" class="uppercase px-2 py-1 bg-white border border-slate-300 rounded text-xs font-semibold"></div>
                                <div class="flex flex-col gap-0.5"><label class="text-[9px] font-bold text-slate-500 uppercase">KM</label><input type="number" id="editSKM-${r.id}" value="${r.km}" class="px-2 py-1 bg-white border border-slate-300 rounded text-xs font-semibold"></div>
                                <div class="flex flex-col gap-0.5"><label class="text-[9px] font-bold text-slate-500 uppercase">Peças</label><input type="number" id="editSPec-${r.id}" value="${r.pecas}" class="px-2 py-1 bg-white border border-slate-300 rounded text-xs font-semibold"></div>
                                <div class="flex flex-col gap-0.5"><label class="text-[9px] font-bold text-slate-500 uppercase">M. Obra</label><input type="number" id="editSMao-${r.id}" value="${r.maoObra}" class="px-2 py-1 bg-white border border-slate-300 rounded text-xs font-semibold"></div>
                            </div>
                            <textarea id="editSDesc-${r.id}" class="w-full mt-2 px-2 py-1 bg-white border border-slate-300 rounded text-xs font-medium" placeholder="Descrição">${r.desc}</textarea>
                            <div class="flex justify-end gap-1 mt-2">
                                <button class="btn bg-emerald-600 hover:bg-emerald-500 text-white text-xs font-bold px-3 py-1.5 rounded-lg transition" onclick="toggleEdicaoServico(event, ${v.id}, ${r.id})"><i class="fa-solid fa-floppy-disk"></i> Salvar</button>
                            </div>
                        </td></tr>`;
                    }
                    return `<tr class="hover:bg-slate-50 transition border-b border-slate-100">
                        <td class="p-2.5 font-medium">${r.data}</td>
                        <td class="p-2.5 font-bold text-slate-800">${r.categoria}</td>
                        <td class="p-2.5 font-medium">${r.responsavel}</td>
                        <td class="p-2.5 font-mono text-slate-600">${r.km || '-'}</td>
                        <td class="p-2.5 font-mono">R$ ${r.pecas.toLocaleString('pt-br',{minimumFractionDigits:2})}</td>
                        <td class="p-2.5 font-mono">R$ ${r.maoObra.toLocaleString('pt-br',{minimumFractionDigits:2})}</td>
                        <td class="no-print p-2.5 text-center">
                            <div class="flex items-center justify-center gap-1">
                                <button class="text-brand-600 hover:bg-brand-50 p-1.5 rounded text-xs transition" title="Imprimir Registro" onclick="imprimirRelatorioUnico(event, ${v.id}, ${r.id})"><i class="fa-solid fa-print"></i></button>
                                <button class="text-amber-600 hover:bg-amber-50 p-1.5 rounded text-xs transition" title="Editar" onclick="toggleEdicaoServico(event, ${v.id}, ${r.id})"><i class="fa-solid fa-pen-to-square"></i></button>
                                <button class="text-rose-600 hover:bg-rose-50 p-1.5 rounded text-xs transition" title="Excluir" onclick="excluirItem(event, ${v.id}, ${r.id})"><i class="fa-solid fa-trash-can"></i></button>
                            </div>
                        </td>
                    </tr>`;
                }).join('');

                container.innerHTML += `
                    <div class="veiculo-bloco bg-white rounded-2xl border border-slate-200/80 shadow-sm overflow-hidden ${isOpen ? 'active' : ''}">
                        <div class="veiculo-header p-4 bg-white flex flex-col sm:flex-row justify-between items-start sm:items-center gap-3 cursor-pointer hover:bg-slate-50/80 transition" onclick="toggleAccordion(event, ${v.id})">
                            <div class="flex items-center gap-3 flex-1 w-full">
                                <i class="fa-solid fa-chevron-down arrow-icon text-slate-400 text-xs"></i>
                                ${isEditV ? 
                                    `<div class="grid grid-cols-2 sm:grid-cols-6 gap-2 w-full" onclick="event.stopPropagation()">
                                        <input type="text" id="editMod-${v.id}" value="${v.modelo}" class="uppercase px-2 py-1 border border-slate-300 rounded text-xs font-bold">
                                        <input type="text" id="editPlaca-${v.id}" value="${v.placa}" class="uppercase px-2 py-1 border border-slate-300 rounded text-xs font-bold" oninput="this.value = aplicarMascaraPlaca(this.value)">
                                        <input type="text" id="editProp-${v.id}" value="${v.proprietario}" class="uppercase px-2 py-1 border border-slate-300 rounded text-xs font-bold">
                                        <input type="text" id="editCor-${v.id}" value="${v.cor}" class="uppercase px-2 py-1 border border-slate-300 rounded text-xs font-bold">
                                        <input type="text" id="editAno-${v.id}" value="${v.ano}" class="px-2 py-1 border border-slate-300 rounded text-xs font-bold">
                                        <input type="number" id="editKMIni-${v.id}" value="${v.kmIni || 0}" class="px-2 py-1 border border-slate-300 rounded text-xs font-bold">
                                    </div>` :
                                    `<div class="flex flex-wrap items-center gap-2 text-xs">
                                        <span class="font-bold text-slate-900 text-sm">${v.modelo}</span>
                                        <code class="bg-slate-100 px-1.5 py-0.5 rounded font-mono border border-slate-200 text-slate-800 font-bold">[${v.placa}]</code>
                                        <span class="text-slate-500 font-medium">• ${v.proprietario} • ${v.cor} • Ano: ${v.ano} • KM Inicial: ${v.kmIni || 0}</span>
                                    </div>`
                                }
                            </div>
                            <div class="no-print flex items-center gap-2 self-end sm:self-auto">
                                <span class="font-bold text-emerald-600 text-sm font-mono mr-2">R$ ${totalV.toLocaleString('pt-br',{minimumFractionDigits:2})}</span>
                                <button class="inline-flex items-center justify-center gap-1 bg-brand-50 hover:bg-brand-100 text-brand-600 text-xs font-bold px-2.5 py-1.5 rounded-lg transition border border-brand-200" onclick="imprimirRelatorioCompleto(event, ${v.id})" title="Imprimir Relatório Completo">
                                    <i class="fa-solid fa-print"></i>
                                </button>
                                <button class="inline-flex items-center justify-center gap-1 ${isEditV ? 'bg-emerald-600 text-white' : 'bg-amber-50 text-amber-700 border border-amber-200'} text-xs font-bold px-2.5 py-1.5 rounded-lg transition" onclick="toggleEdicaoVeiculo(event, ${v.id})">
                                    <i class="fa-solid ${isEditV ? 'fa-floppy-disk' : 'fa-pen-to-square'}"></i> ${isEditV ? 'Salvar' : 'Editar'}
                                </button>
                                <button class="inline-flex items-center justify-center gap-1 text-rose-600 hover:bg-rose-50 p-1.5 rounded-lg transition text-xs" onclick="removerVeiculo(event, ${v.id})" title="Excluir Veículo">
                                    <i class="fa-solid fa-trash-can"></i>
                                </button>
                            </div>
                        </div>
                        <div class="veiculo-content border-t border-slate-100">
                            <div class="table-container overflow-x-auto">
                                <table class="w-full text-left text-xs border-collapse">
                                    <thead>
                                        <tr class="bg-slate-900 text-white font-bold uppercase tracking-wider text-[11px]">
                                            <th class="py-3 px-3">Data</th>
                                            <th class="py-3 px-3">Tipo</th>
                                            <th class="py-3 px-3">Prestador</th>
                                            <th class="py-3 px-3">KM</th>
                                            <th class="py-3 px-3">Peças</th>
                                            <th class="py-3 px-3">Mão Obra</th>
                                            <th class="py-3 px-3 text-center no-print">Ações</th>
                                        </tr>
                                    </thead>
                                    <tbody class="divide-y divide-slate-100 bg-white font-medium text-slate-700">
                                        ${linhas || '<tr><td colspan="7" class="text-center py-6 text-slate-400 font-medium">Nenhum lançamento registrado.</td></tr>'}
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    </div>`;
            });
        }

        function imprimirRelatorioUnico(e, vId, sId) {
            e.stopPropagation();
            const v = dados.veiculos.find(ve => ve.id == vId);
            const s = v.registros.find(re => re.id == sId);
            const html = `<div style="padding:40px; font-family:sans-serif; border:2px solid #000;"><h1 style="text-align:center; text-transform:uppercase; border-bottom:2px solid #000;">Relatório de Manutenção</h1><p><strong>VEÍCULO:</strong> ${v.modelo} | <strong>PLACA:</strong> ${v.placa}</p><p><strong>COR:</strong> ${v.cor} | <strong>ANO:</strong> ${v.ano} | <strong>KM INICIAL:</strong> ${v.kmIni || 0}</p><p><strong>PROPRIETÁRIO:</strong> ${v.proprietario}</p><hr><p><strong>DATA:</strong> ${s.data} | <strong>KM:</strong> ${s.km || '---'}</p><p><strong>CATEGORIA:</strong> ${s.categoria} | <strong>PRESTADOR:</strong> ${s.responsavel}</p><div style="background:#f4f4f4; padding:15px; border:1px solid #ccc; white-space: pre-line;"><strong>DESCRIÇÃO:</strong><br>${s.desc}</div><p style="font-size:1.2em"><strong>TOTAL: R$ ${s.total.toLocaleString('pt-br',{minimumFractionDigits:2})}</strong></p></div>`;
            const win = window.open('', '_blank'); win.document.write(html); win.document.close(); win.print(); win.close();
        }

        function imprimirRelatorioCompleto(e, vId) {
            e.stopPropagation();
            const v = dados.veiculos.find(ve => ve.id == vId);
            let totalGeral = 0;
            let tabela = v.registros.map(r => { totalGeral += r.total; return `<tr><td style="border:1px solid #000; padding:6px">${r.data}</td><td style="border:1px solid #000; padding:6px">${r.categoria}</td><td style="border:1px solid #000; padding:6px">${r.responsavel}</td><td style="border:1px solid #000; padding:6px">${r.km || '-'}</td><td style="border:1px solid #000; padding:6px">R$ ${r.total.toLocaleString('pt-br',{minimumFractionDigits:2})}</td></tr>`; }).join('');
            let detalhado = v.registros.map(r => { return `<div style="margin-bottom:15px; border-bottom:1px dashed #ccc; padding-bottom:5px"><p style="margin:2px 0"><strong>${r.data} - ${r.categoria} (${r.responsavel}):</strong></p><p style="margin:2px 0; font-style:italic; white-space: pre-line;">${r.desc || 'Sem descrição.'}</p></div>`; }).join('');
            const html = `<div style="padding:30px; font-family:sans-serif;"><h1 style="text-align:center; margin-bottom:5px">Relatório de Frota</h1><p style="text-align:center; margin-top:0"><strong>VEÍCULO:</strong> ${v.modelo} [${v.placa}] - ${v.cor} - Ano: ${v.ano} - KM Inicial: ${v.kmIni || 0}</p><p style="text-align:center;"><strong>PROPRIETÁRIO:</strong> ${v.proprietario}</p><h3 style="background:#eee; padding:5px; border:1px solid #000">1. RESUMO SIMPLIFICADO</h3><table style="width:100%; border-collapse:collapse; margin-bottom:30px"><thead><tr style="background:#f4f4f4"><th style="border:1px solid #000; padding:6px">Data</th><th style="border:1px solid #000; padding:6px">Tipo</th><th style="border:1px solid #000; padding:6px">Prestador</th><th style="border:1px solid #000; padding:6px">KM</th><th style="border:1px solid #000; padding:6px">Valor</th></tr></thead><tbody>${tabela}</tbody></table><p style="text-align:right; font-size:1.2em"><strong>TOTAL ACUMULADO: R$ ${totalGeral.toLocaleString('pt-br',{minimumFractionDigits:2})}</strong></p><h3 style="background:#eee; padding:5px; border:1px solid #000; margin-top:40px;">2. HISTÓRICO DETALHADO (DESCRIÇÕES)</h3><div style="font-size: 0.9em">${detalhado}</div></div>`;
            const win = window.open('', '_blank'); win.document.write(`<html><head><title>Relatorio_${v.placa}</title></head><body>${html}</body></html>`); win.document.close(); win.print(); win.close();
        }

        function lancarServico() {
            const vId = document.getElementById('selectVeiculo').value;
            if(!vId) return alert("Selecione um veículo!");
            const vIdx = dados.veiculos.findIndex(v => v.id == vId);
            const p = parseFloat(document.getElementById('servPecas').value) || 0;
            const m = parseFloat(document.getElementById('servMaoObra').value) || 0;
            dados.veiculos[vIdx].registros.unshift({ id: Date.now(), data: document.getElementById('servData').value.split('-').reverse().join('/'), categoria: document.getElementById('servCat').value, responsavel: document.getElementById('servResponsavel').value.toUpperCase(), km: document.getElementById('servKM').value, pecas: p, maoObra: m, total: p + m, desc: document.getElementById('servDesc').value });
            blocosAbertos.add(Number(vId));
            salvarEAtualizar();
            ['servDesc', 'servKM', 'servResponsavel'].forEach(id => document.getElementById(id).value = '');
        }

        function exportarDados() { 
            const agora = new Date();
            const dia = String(agora.getDate()).padStart(2, '0');
            const mes = String(agora.getMonth() + 1).padStart(2, '0');
            const ano = agora.getFullYear();
            const hora = String(agora.getHours()).padStart(2, '0');
            const min = String(agora.getMinutes()).padStart(2, '0');

            const dataHoraFmt = `${ano}_${dia}-${mes}-${ano}_${hora}h${min}`;
            const blob = new Blob([JSON.stringify(dados)], {type: 'application/json'}); 
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a'); 
            a.href = url; 
            a.download = `FleetManager_PRO_${dataHoraFmt}.json`; 
            a.click(); 
            URL.revokeObjectURL(url);
        }

        function renderizarSelect() { 
            const s = document.getElementById('selectVeiculo'); 
            s.innerHTML = '<option value="">-- Selecione --</option>'; 
            dados.veiculos.forEach(v => s.innerHTML += `<option value="${v.id}">${v.modelo} [${v.placa}]</option>`); 
        }

        function excluirItem(e, vId, rId) { 
            e.stopPropagation(); 
            if(confirm("Excluir?")) { 
                const vIdx = dados.veiculos.findIndex(v => v.id == vId); 
                dados.veiculos[vIdx].registros = dados.veiculos[vIdx].registros.filter(r => r.id != rId); 
                salvarEAtualizar(); 
            } 
        }

        function removerVeiculo(e, id) { 
            e.stopPropagation(); 
            if(confirm("Excluir Veículo?")) { 
                dados.veiculos = dados.veiculos.filter(v => v.id != id); 
                salvarEAtualizar(); 
            } 
        }

        function importarDados(e) { 
            const reader = new FileReader(); 
            reader.onload = (ev) => { 
                try { 
                    dados = JSON.parse(ev.target.result); 
                    salvarEAtualizar(); 
                } catch { 
                    alert("Erro ao importar arquivo!"); 
                } 
            }; 
            reader.readAsText(e.target.files[0]); 
        }

        salvarEAtualizar();
    </script>
</body>
</html>
